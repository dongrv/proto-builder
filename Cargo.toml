[package]
name = "proto-builder"
version = "1.2.0"
edition = "2021"
description = "Fast, cross-platform protobuf compiler for the shengyou repository"
repository = "https://github.com/dongrv/proto-builder"
default-run = "proto-builder"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"
dirs = "5.0"
sha2 = "0.10"
anyhow = "1.0"
flate2 = "1.1"
fs2 = "0.4"
regex = "1.11"
globset = "0.4"
rayon = "1.10"
quick-xml = { version = "0.37", features = ["serialize"] }
crossterm = "0.29"
ctrlc = "3.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ed25519-dalek = "2.2"
semver = "1.0"
hex = "0.4"
tempfile = "3.20"
self-replace = "1.5"
getrandom = "0.2"
unicode-width = "0.2"
similar = "2.7"
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_Globalization", "Win32_System_JobObjects", "Win32_Security", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
strip = true

